# The 5-mammal "all spread out" case from sandbox/optimizer/LOG.md (2026-10-01 final run).
# Same validated hyperparameters as validated_3mammal.yaml -- NOT separately re-validated for
# 5 mammals' convergence reliability specifically (see SCIENTIFIC_FINDINGS.md's "Open, not yet
# acted on" section: multi-mammal GA convergence is not established the way single-mammal is).
# Runtime is longer than 3-mammal (GA cost is superlinear in mammal count, also flagged there).

optimizer:
  n_waypoints: 30
  w_time: 20.0
  sel_max_weight: 0.5
  pop_size: 32
  n_gen: 200
  n_seeds: 5
  use_hard_mammal_constraint: true
  constraint_voyage_time_hr: null   # null = echo_ais's own voyage time (validated); see config/default_config.yaml for details
  mutation_initial_rate: 0.3
  mutation_final_rate: 0.01
  crossover_initial_rate: 0.95
  crossover_final_rate: 0.7
  seed_population_shape: "min_speed"

tl_model:
  kind: "light"
  light_model_dir: null   # set via MUTE_LIGHT_MODEL_DIR env var, or fill in here

data:
  baseline_route_csv: "data/baseline_route.csv"
  mammal_paths_csv: "data/mammal_paths.csv"

mammal_ids: [0, 4, 8, 12, 16]
output_dir: "results/validated_5mammal"
